[project]
name = "smart-hass-water-heater"
version = "0.1.0"
description = "Home Assistant integration estimating the hot water left in an electric water heater"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "review/tests"]
